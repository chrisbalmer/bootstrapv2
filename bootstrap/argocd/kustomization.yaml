apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yaml
  # Use the official ArgoCD installation manifest
  - https://raw.githubusercontent.com/argoproj/argo-cd/v2.13.2/manifests/install.yaml

# JSON patches to reduce resource requirements for single-node cluster
patches:
  # Reduce server replicas
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: argocd-server
  
  # Reduce repo-server replicas
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: Deployment
      name: argocd-repo-server
  
  # Reduce application-controller replicas
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
    target:
      kind: StatefulSet
      name: argocd-application-controller

# Add common labels
labels:
  - pairs:
      managed-by: bootstrap

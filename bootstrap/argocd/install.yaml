# ArgoCD Installation Manifest
# This uses the official HA installation manifest
# Source: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/ha/install.yaml
#
# To install ArgoCD:
#   kubectl apply -k bootstrap/argocd/
#
# Or use the Makefile:
#   make bootstrap-argocd

apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Disable admin user after initial setup
  # admin.enabled: "false"
  
  # Server configuration
  url: https://argocd.bootstrapv2.local
  
  # Enable anonymous read-only access (optional)
  # users.anonymous.enabled: "true"
  
  # Application configuration
  application.instanceLabelKey: argocd.argoproj.io/instance
  
  # Resource customizations
  resource.customizations: |
    admissionregistration.k8s.io/MutatingWebhookConfiguration:
      ignoreDifferences: |
        jsonPointers:
        - /webhooks/0/clientConfig/caBundle
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-rbac-cm
    app.kubernetes.io/part-of: argocd
data:
  # Default policy for all users
  policy.default: role:readonly
  
  # CSV of policies - can be customized
  # policy.csv: |
  #   g, admin, role:admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Enable insecure mode (no TLS) for internal access
  server.insecure: "true"

machine:
  network:
    hostname: bootstrapv2
    interfaces:
      - interface: end0
        addresses:
          - 172.21.7.100/24
        routes:
          - network: 0.0.0.0/0
            gateway: 172.21.7.1
    nameservers:
      - 1.1.1.3
      - 1.0.0.3
  install:
    disk: /dev/nvme0n1
    image: ghcr.io/chrisbalmer/installer:v1.10.7-1-g31471348f
    wipe: false
  kubelet:
    image: ghcr.io/siderolabs/kubelet:v1.31.1

cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: custom
      urls:
        - https://gist.githubusercontent.com/chrisbalmer/8fa4bf2f5df018c70d40c819537824ea/raw/64aef672ef09c6da6850a9fd277f56a15173c22a/antrea-talos-2.4.3.yml
